[package]
name = "pdf-corrector"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "pdf-corrector"
path = "src/main.rs"

[dependencies]
slint = "1.10"
pdfium-render = "0.8"
image = "0.25"
rfd = "0.15"
anyhow = "1.0"
zspell = { version = "0.5", features = ["unstable-suggestions"] } # ponytail: flag unstable solo por suggest(); si molesta, Fase 3 queda en check()

[build-dependencies]
slint-build = "1.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
