[package]
name = "pdf-corrector"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "pdf-corrector"
path = "src/main.rs"

[dependencies]
slint = "1.10"
pdfium-render = "0.8"
image = "0.25"
rfd = "0.15"
anyhow = "1.0"
ureq = "3" # ponytail: cliente HTTP sync sin runtime tokio; solo habla con el sidecar LT local
serde = { version = "1", features = ["derive"] } # ponytail: solo para el historial JSON
serde_json = "1" # ponytail: parsea /v2/check sin tipos extra

[build-dependencies]
slint-build = "1.10"
ureq = "3"
zip = "0.6"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
